# Static site — publish from repository root (no build step)
[build]
  publish = "."

# Google and many crawlers request /favicon.ico at the domain root by default.
[[redirects]]
  from = "/favicon.ico"
  to = "/assets/images/fav1.ico"
  status = 200
  force = true

